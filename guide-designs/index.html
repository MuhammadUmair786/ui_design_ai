<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUIDE Designs — evaluation gallery</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <p class="eyebrow">GUIDE</p>
        <h1>Designs</h1>
        <p class="lede">
          Generated HTML screens for designer evaluation. Preview a variant, then open the full page to interact and review.
        </p>
      </header>

      <div class="toolbar" role="toolbar" aria-label="Filter by product">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="MediBook" aria-pressed="false">MediBook</button>
        <button type="button" class="chip" data-filter="QuickBite" aria-pressed="false">QuickBite</button>
        <button type="button" class="chip" data-filter="BrightMinds" aria-pressed="false">BrightMinds</button>
        <button type="button" class="chip" data-filter="NovBank" aria-pressed="false">NovBank</button>
        <button type="button" class="chip" data-filter="HomeIQ" aria-pressed="false">HomeIQ</button>
        <button type="button" class="chip" data-filter="SplitEasy" aria-pressed="false">SplitEasy</button>
        <p class="count" id="count"></p>
      </div>

      <div class="grid" id="grid"></div>
      <p class="empty" id="empty">No screens in this group.</p>
    </div>

    <script>
      const DESIGNS = [
        { file: "01-medibook-appointment-booking.html", title: "MediBook Appointment Booking", product: "MediBook", frame: "phone" },
        { file: "02-quickbite-order-tracking.html", title: "QuickBite Real-Time Order Tracking", product: "QuickBite", frame: "phone" },
        { file: "03-brightminds-dashboard.html", title: "BrightMinds Dashboard", product: "BrightMinds", frame: "wide" },
        { file: "04-novbank-transfer.html", title: "NovBank Transfer", product: "NovBank", frame: "phone" },
        { file: "05-homeiq-tablet-dashboard.html", title: "HomeIQ Tablet Control Dashboard", product: "HomeIQ", frame: "wide" },
        { file: "06-spliteasy-settlement.html", title: "SplitEasy Settlement Interface", product: "SplitEasy", frame: "phone" },
        { file: "07-medibook-book-appointment.html", title: "Book Appointment — MediBook", product: "MediBook", frame: "phone" },
        { file: "08-quickbite-order-tracking.html", title: "QuickBite Order Tracking", product: "QuickBite", frame: "phone" },
        { file: "09-brightminds-home.html", title: "BrightMinds Home Screen", product: "BrightMinds", frame: "wide" },
        { file: "10-novbank-money-transfer.html", title: "NovBank Money Transfer", product: "NovBank", frame: "phone" },
        { file: "11-homeiq-smart-home-dashboard.html", title: "HomeIQ Smart Home Dashboard", product: "HomeIQ", frame: "wide" },
        { file: "12-spliteasy-bill-split.html", title: "SplitEasy Bill Split", product: "SplitEasy", frame: "phone" },
        { file: "13-medibook-appointment-booking.html", title: "MediBook Appointment Booking", product: "MediBook", frame: "phone" },
        { file: "14-quickbite-order-tracking.html", title: "QuickBite Order Tracking", product: "QuickBite", frame: "phone" },
        { file: "15-brightminds-home.html", title: "BrightMinds Home Screen", product: "BrightMinds", frame: "wide" },
        { file: "16-novbank-money-transfer.html", title: "Money Transfer — NovBank", product: "NovBank", frame: "phone" },
        { file: "17-homeiq-dashboard.html", title: "HomeIQ Dashboard", product: "HomeIQ", frame: "wide" },
        { file: "18-spliteasy-split-the-bill.html", title: "SplitEasy Split the Bill", product: "SplitEasy", frame: "phone" },
      ];

      const grid = document.getElementById("grid");
      const countEl = document.getElementById("count");
      const emptyEl = document.getElementById("empty");
      let filter = "all";

      function hrefFor(file) {
        return `./designs/${file}`;
      }

      function render() {
        grid.innerHTML = DESIGNS.map((design) => {
          const src = hrefFor(design.file);
          return `
            <article class="card" data-product="${design.product}">
              <div class="stage">
                <div class="device ${design.frame}">
                  <div class="screen">
                    <iframe
                      src="${src}"
                      title="${design.title} preview"
                      loading="lazy"
                      sandbox="allow-scripts allow-same-origin allow-forms"
                    ></iframe>
                  </div>
                </div>
              </div>
              <div class="meta">
                <span class="product">${design.product}</span>
                <h2 class="title">${design.title}</h2>
                <span class="file">${design.file}</span>
                <div class="actions">
                  <a class="open" href="${src}" target="_blank" rel="noopener">Open full page</a>
                </div>
              </div>
            </article>
          `;
        }).join("");
        applyFilter();
      }

      function applyFilter() {
        const cards = [...grid.querySelectorAll(".card")];
        let visible = 0;
        for (const card of cards) {
          const show = filter === "all" || card.dataset.product === filter;
          card.classList.toggle("is-hidden", !show);
          if (show) visible += 1;
        }
        countEl.textContent = `${visible} of ${DESIGNS.length} screens`;
        emptyEl.style.display = visible === 0 ? "block" : "none";
      }

      document.querySelector(".toolbar").addEventListener("click", (event) => {
        const button = event.target.closest("[data-filter]");
        if (!button) return;
        filter = button.dataset.filter;
        for (const chip of document.querySelectorAll(".chip")) {
          chip.setAttribute("aria-pressed", String(chip === button));
        }
        applyFilter();
      });

      render();
    </script>
  </body>
</html>
